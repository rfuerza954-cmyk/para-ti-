<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .pantalla {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: rgba(0, 0, 0, 0.45);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        input {
            width: 80%;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #paginaPrincipal {
            display: none;
        }

        .tarjeta {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- PANTALLA DE ENTRADA -->
    <div class="pantalla" id="entrada">

        <h1>Antes de entrar...</h1>

        <p>
            Para continuar, pon el año que nos conocimos.
        </p>

        <input
            type="number"
            id="anio"
            placeholder="Escribe el año"
        >

        <br>

        <button onclick="entrar()">
            Entrar
        </button>

        <p id="mensaje"></p>

    </div>


    <!-- PÁGINA PRINCIPAL -->
    <div class="pantalla" id="paginaPrincipal">

        <h1>¡Bienvenido! ❤️</h1>

        <p>
            Has entrado correctamente a la página.
        </p>

        <div class="tarjeta">

            <h2>Mi página</h2>

            <p>
                Aquí puedes colocar tus fotos, recuerdos,
                información y todo lo que quieras compartir.
            </p>

        </div>

    </div>


    <script>

        function entrar() {

            const anio = document.getElementById("anio").value;
            const mensaje = document.getElementById("mensaje");

            if (anio === "2023") {

                document.getElementById("entrada").style.display = "none";

                document.getElementById("paginaPrincipal").style.display = "block";

            } else if (anio === "") {

                mensaje.textContent = "Escribe el año para continuar.";

            } else {

                mensaje.textContent = "Año incorrecto. Inténtalo nuevamente.";

            }
        }

    </script>

</body>
</html>
